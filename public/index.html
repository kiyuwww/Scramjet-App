<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
	<title>Свобода</title>

	<link rel="shortcut icon" content="favicon.ico" />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

	<script src="/scram/scramjet.all.js"></script>
	<script src="/baremux/index.js"></script>

	<link rel="stylesheet" href="index.css" />
	<script src="register-sw.js" defer></script>
	<script src="search.js" defer></script>
	<script src="index.js" defer></script>
</head>
<body>
	<main>
		<div class="brand">С В О Б О Д А</div>

		<!-- Блок авторизации -->
		<div id="loginBox" class="login-box hidden">
			<form id="login-form" class="search" style="margin-bottom: 12px;">
				<input id="login-email" class="input" type="email" placeholder="Email" autocomplete="username" />
				<input id="login-password" class="input" type="password" placeholder="Пароль" autocomplete="current-password" style="margin-top: 8px;" />
			</form>
			<div style="display:flex; gap:8px; margin-top:8px;">
				<button id="login-btn" type="button">Войти</button>
				<button id="signup-btn" type="button">Регистрация</button>
			</div>
		</div>
		<button id="logout-btn" type="button" class="hidden" style="margin-bottom:12px;">Выйти</button>

		<form id="sj-form" class="search">
			<svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.5"/>
				<path d="M16 16L21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
			</svg>

			<input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />

			<input
				id="sj-address"
				class="input"
				type="text"
				placeholder="Искать свободно..."
				autocomplete="off"
				spellcheck="false"
				aria-label="Поиск"
			/>

			<span class="shortcut">Enter</span>
		</form>

		<div class="tagline">В каждом запросе — простор</div>

		<div class="error-area">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
	<script src="assets/js/auth.js"></script>
</body>
</html>
